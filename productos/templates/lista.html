<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos</title>
    <style>
        :root {
  --bg-color: #0b0f19;
  --card-bg: #111827;
  --text-main: #f3f4f6;
  --text-muted: #9ca3af;
  --border-color: #1f2937;
  --accent-color: #3b82f6;
  --accent-soft: rgba(59, 130, 246, 0.15);
  --accent-dark: #60a5fa;
  --danger-color: #ef4444;
  --shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.5);
  --radius: 10px;
}

* {
  box-sizing: border-box;
}

body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: 
    radial-gradient(circle at 50% 0%, #1e1b4b 0%, transparent 50%),
    var(--bg-color);
  background-attachment: fixed;
  color: var(--text-main);
  max-width: 800px;
  margin: 0 auto;
  padding: 40px 20px 80px;
  line-height: 1.5;
  min-height: 100vh;
}

/* Encabezados y Layout */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
  padding: 16px 24px;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

h1 {
  font-family: inherit;
  font-size: 1.5rem;
  font-weight: 700;
  font-style: normal;
  margin: 0 0 24px 0;
  letter-spacing: -0.025em;
  color: #ffffff;
}

.header h1 {
  margin: 0;
  font-size: 1.25rem;
}

/* Tarjetas */
.card {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  overflow: hidden;
  transition: border-color 0.2s ease, transform 0.2s ease;
}

.card::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0;
  bottom: 0;
  width: 3px;
  background: var(--accent-color);
  opacity: 0;
  transition: opacity 0.2s ease;
}

.card:hover {
  transform: translateY(-2px);
  border-color: #374151;
}

.card:hover::before {
  opacity: 1;
}

.card h3 {
  margin: 0 0 8px 0;
  font-family: inherit;
  font-size: 1.1rem;
  font-weight: 600;
  color: #ffffff;
}

.card p {
  margin: 0 0 20px 0;
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* Botones y Enlaces */
.btn {
  display: inline-block;
  padding: 8px 16px;
  border-radius: 6px;
  font-size: 0.85rem;
  text-decoration: none;
  transition: all 0.2s ease;
  font-weight: 500;
}

.btn-primary {
  background-color: var(--accent-soft);
  color: var(--accent-dark);
  border: 1px solid rgba(59, 130, 246, 0.3);
}

.btn-primary:hover {
  background-color: var(--accent-color);
  color: #ffffff;
  border-color: var(--accent-color);
  box-shadow: 0 0 12px rgba(59, 130, 246, 0.4);
}

.actions {
  display: flex;
  gap: 12px;
  font-size: 0.85rem;
}

.actions a {
  color: var(--text-muted);
  text-decoration: none;
  font-weight: 500;
  padding: 4px 8px;
  border-radius: 4px;
  background: transparent;
  transition: all 0.2s ease;
}

.actions a:hover {
  color: #ffffff;
  background: #1f2937;
}

.actions a.delete {
  color: var(--danger-color);
}

.actions a.delete:hover {
  background: rgba(239, 68, 68, 0.15);
  color: #fca5a5;
}

/* Formularios */
form {
  background: var(--card-bg);
  border: 1px solid var(--border-color);
  border-radius: var(--radius);
  padding: 28px;
  box-shadow: var(--shadow);
}

.form-group {
  margin-bottom: 20px;
}

label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  margin-bottom: 8px;
  color: var(--text-muted);
}

input[type="text"] {
  width: 100%;
  padding: 10px 14px;
  background: #0b0f19;
  border: 1px solid var(--border-color);
  border-radius: 6px;
  font-size: 0.9rem;
  font-family: inherit;
  color: var(--text-main);
  transition: all 0.2s ease;
  outline: none;
}

input[type="text"]::placeholder {
  color: #4b5563;
}

input[type="text"]:focus {
  border-color: var(--accent-color);
  box-shadow: 0 0 0 3px var(--accent-soft);
}

.btn-submit {
  width: 100%;
  padding: 12px;
  background-color: var(--accent-color);
  color: #ffffff;
  border: none;
  border-radius: 6px;
  font-size: 0.9rem;
  font-weight: 600;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s ease;
  margin-top: 8px;
}

.btn-submit:hover {
  background-color: #2563eb;
  box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
}

.back-link {
  display: block;
  text-align: center;
  margin-top: 20px;
  font-size: 0.85rem;
  color: var(--text-muted);
  text-decoration: none;
  transition: color 0.2s ease;
}

.back-link:hover {
  color: #ffffff;
}

/* Detalle */
.detail-item {
  margin-bottom: 16px;
  padding: 12px 16px;
  background: #0b0f19;
  border: 1px solid var(--border-color);
  border-radius: 6px;
}

.detail-item span {
  display: block;
  font-size: 0.7rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--accent-dark);
  margin-bottom: 4px;
}

.detail-item p {
  margin: 0;
  font-size: 0.95rem;
}

.footer-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 24px;
  padding-top: 16px;
  border-top: 1px solid var(--border-color);
}

/* Estado vacío */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-family: inherit;
  font-style: normal;
  background: var(--card-bg);
  border: 1px dashed var(--border-color);
  border-radius: var(--radius);
}
    </style>
</head>
<body>

    <div class="header">
        <h1>Productos</h1>
        <a href="/productos/crear/" class="btn btn-primary">Nuevo Producto</a>
    </div>

    {% for producto in productos %}
        <div class="card">
            <h3>{{ producto.nombre }}</h3>
            <p><strong>Categoría:</strong> {{ producto.categoria }}</p>
            <p><strong>Precio:</strong> ${{ producto.precio }}</p>
            <p><strong>Cantidad:</strong> {{ producto.cantidad }}</p>
            <p><strong>Estado:</strong> {{ producto.estado }}</p>

            <div class="actions">
                <a href="/productos/detalle/{{ producto.id }}/">Ver</a>
                <a href="/productos/editar/{{ producto.id }}/">Editar</a>
                <a href="/productos/eliminar/{{ producto.id }}/" class="delete">Eliminar</a>
            </div>
        </div>
    {% empty %}
        <div class="empty-state">
            <p>No hay productos registrados.</p>
        </div>
    {% endfor %}

</body>
</html>
